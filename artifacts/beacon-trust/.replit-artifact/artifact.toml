kind = "web"
previewPath = "/"
title = "Beacon Trust"
version = "1.0.0"
id = "artifacts/beacon-trust"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5173

[services.development]
run = "npm run dev -w @workspace/beacon-trust"

[services.production]
build = [ "npm", "run", "build", "--workspace=@workspace/beacon-trust" ]
serve = "static"
publicDir = "artifacts/beacon-trust/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5173"
BASE_PATH = "/"
