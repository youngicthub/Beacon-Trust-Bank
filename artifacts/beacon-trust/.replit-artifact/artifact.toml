kind = "web"
previewPath = "/"
title = "Beacon Trust"
version = "1.0.0"
id = "artifacts/beacon-trust"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22105

[services.development]
run = "pnpm --filter @workspace/beacon-trust run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/beacon-trust", "run", "build" ]
serve = "static"
publicDir = "artifacts/beacon-trust/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22105"
BASE_PATH = "/"
